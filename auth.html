<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DialysisSafe Passkey</title><style>body{font-family:system-ui;max-width:520px;margin:8vh auto;padding:24px;background:#09090b;color:#f4f4f5}main{background:#18181b;border:1px solid #3f3f46;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;margin:8px 0;border-radius:12px;box-sizing:border-box}input{background:#09090b;color:white;border:1px solid #52525b}button{border:0;background:#facc15;font-weight:700;cursor:pointer}button.secondary{background:#3f3f46;color:white}#status{min-height:24px;color:#a1a1aa}</style></head>
<body><main><h1>DialysisSafe</h1><p>Secure access with a device passkey.</p><input id="username" autocomplete="username webauthn" placeholder="Username for first-time setup"><button id="register">Create passkey</button><button id="login" class="secondary">Use passkey</button><p id="status" role="status"></p></main>
<script>
const statusEl=document.querySelector('#status'); const usernameEl=document.querySelector('#username');
const b64=(s)=>{const pad='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));};
const enc=(x)=>btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
const json=(o)=>JSON.stringify(o);
function prepOptions(o){if(o.challenge)o.challenge=b64(o.challenge);if(o.user?.id)o.user.id=b64(o.user.id);(o.excludeCredentials||[]).forEach(c=>c.id=b64(c.id));(o.allowCredentials||[]).forEach(c=>c.id=b64(c.id));return o;}
function regResponse(r){return {id:r.id,rawId:enc(r.rawId),type:r.type,response:{clientDataJSON:enc(r.response.clientDataJSON),attestationObject:enc(r.response.attestationObject)}};}
function authResponse(r){return {id:r.id,rawId:enc(r.rawId),type:r.type,response:{clientDataJSON:enc(r.response.clientDataJSON),authenticatorData:enc(r.response.authenticatorData),signature:enc(r.response.signature),userHandle:r.response.userHandle?enc(r.response.userHandle):null}};}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:json(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
register.onclick=async()=>{try{const username=usernameEl.value.trim();if(!username)throw Error('Enter a username first.');statusEl.textContent='Preparing passkey…';const o=prepOptions(await post('/api/auth/register/options',{username}));const c=await navigator.credentials.create({publicKey:o});await post('/api/auth/register/verify',{username,response:regResponse(c)});location.href='/index.html';}catch(e){statusEl.textContent=e.message;}};
login.onclick=async()=>{try{statusEl.textContent='Waiting for your device…';const o=prepOptions(await (await fetch('/api/auth/login/options')).json());const c=await navigator.credentials.get({publicKey:o});await post('/api/auth/login/verify',{response:authResponse(c)});location.href='/index.html';}catch(e){statusEl.textContent=e.message;}};
</script></body></html>
